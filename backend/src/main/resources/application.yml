spring:
  application:
    name: approval-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/approval}
    username: ${DB_USER:approval}
    password: ${DB_PASSWORD:}
    hikari:
      # Retry на случай доли секунды рассинхрона даже при healthcheck на Postgres.
      initialization-fail-timeout: 60000
      connection-timeout: 10000

  jpa:
    # В проде схемой управляет Liquibase, Hibernate её не трогает.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # TODO: создать changelog при реализации схемы (см. CLAUDE.md, раздел "Схема БД").
    enabled: false

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_SIZE:10MB}

  ai:
    gigachat:
      auth:
        bearer:
          api-key: ${GIGACHAT_API_KEY:}
        scope: ${GIGACHAT_SCOPE:GIGACHAT_API_PERS}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Наружу только health - используется как healthcheck в compose.yaml.
        include: health
  endpoint:
    health:
      probes:
        enabled: true

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:documents}

max:
  bot:
    # Токен выдаётся организаторами. В репозиторий не попадает никогда.
    token: ${MAX_BOT_TOKEN:}
    api-url: ${MAX_BOT_API_URL:https://botapi.max.ru}
  mini-app:
    url: ${MAX_MINI_APP_URL:}

app:
  # Решение A: переключатель участника для сквозной проверки сценария одним человеком.
  # В проде выключается. Порядок использования описан в README.
  demo-mode: ${DEMO_MODE:false}
  ai:
    # Решение E: деградация, если GigaChat недоступен.
    # Детерминированные проверки правил работают всегда, без LLM.
    enabled: ${AI_ENABLED:true}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    fallback-on-error: ${AI_FALLBACK_ON_ERROR:true}

logging:
  level:
    ru.sibvibe.approval: ${LOG_LEVEL:INFO}
